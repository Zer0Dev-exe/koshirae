[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koshirae"
version = "0.1.0"
description = "Repos (GitHub/GitLab/Bitbucket), MongoDB/Atlas y procesos con PM2 desde una sola CLI + TUI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.27.3",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
    "platformdirs>=4.12.4",
    "pymongo>=4.6",
    "requests>=2.31",
    "pillow>=10",
]

[project.optional-dependencies]
claude = ["anthropic>=1.13.0"]
gemini = ["google-genai>=2.29.0"]
openai = ["openai>=3.28.0"]
ai = ["anthropic>=1.13.0", "google-genai>=2.29.0", "openai>=3.28.0"]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "respx>=0.23.1"]
build = ["pyinstaller>=6"]

[project.scripts]
koshirae = "koshirae.cli:main"
ksr = "koshirae.cli:main"
gk = "koshirae.cli:gk"
mgs = "koshirae.cli:mgs"

[tool.hatch.build.targets.wheel]
packages = ["src/koshirae"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
